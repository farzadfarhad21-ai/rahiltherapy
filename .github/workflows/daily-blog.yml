name: Daily Blog Automation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  daily-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node daily-automation.js

      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Automated daily blog post"
          git push

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token $VERCEL_TOKEN

      - name: Poll and Send Telegram
        run: |
          ARTICLE_URL=$(node -pe "JSON.parse(require('fs').readFileSync('.article-info.json','utf8')).articleUrl")
          IMAGE_FILENAME=$(node -pe "JSON.parse(require('fs').readFileSync('.article-info.json','utf8')).imageFilename")
          SEO_TITLE=$(node -pe "JSON.parse(require('fs').readFileSync('.article-info.json','utf8')).seoTitle")
          TAG=$(node -pe "JSON.parse(require('fs').readFileSync('.article-info.json','utf8')).tag")
          DATE=$(node -pe "JSON.parse(require('fs').readFileSync('.article-info.json','utf8')).date")
          echo "Polling $ARTICLE_URL"
          MAX_ATTEMPTS=48
          for i in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ARTICLE_URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Article is live after ${i} attempts"
              break
            fi
            echo "Attempt $i: HTTP $HTTP_CODE - retrying in 5s..."
            sleep 5
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Article never came up after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          EMOJI=$(node -e "const m={\\"اضطراب\\":\\"😰\\",\\"افسردگی\\":\\"😔\\",\\"روابط\\":\\"💝\\",\\"عزت نفس\\":\\"✨\\",\\"طرحواره\\":\\"🧠\\",\\"OCD\\":\\"🔄\\",\\"رشد فردی\\":\\"🌱\\",\\"والدین\\":\\"👨‍👩‍👧\\",\\"ADHD\\":\\"🎯\\",\\"ذهن‌آگاهی\\":\\"🧘\\"};console.log(m['$TAG']||'📝')")
          ARTICLE_HTML=$(curl -s "$ARTICLE_URL")
          PARAGRAPHS=$(echo "$ARTICLE_HTML" | node -e "let h='';process.stdin.on('data',d=>h+=d);process.stdin.on('end',()=>{const ps=h.match(/<p[^>]*>([\\\\s\\\\S]*?)<\\\\/p>/g)||[];const ls=ps.slice(1,4).map(p=>p.replace(/<[^>]+>/g,'').trim()).filter(l=>l.length>30).slice(0,3).map(s=>s.length>200?s.substring(0,197)+'...':s);console.log(ls.join(' | '));})")
          SEP="--------------------"
          CAPTION_BODY=" **\n\n\n\n[ادامهٔ مطلب]()\n\n\n📅   #\n💡 روانشناس عمومی | راحله اوینی‌پور"
          IMAGE_PATH=""
          if [[ "$IMAGE_FILENAME" == cat-* ]]; then
            IMAGE_PATH="./$IMAGE_FILENAME"
          else
            IMAGE_PATH="./articles/$IMAGE_FILENAME"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "photo=@${IMAGE_PATH}" \
            -F "caption=${CAPTION_BODY}" \
            -F "parse_mode=Markdown"
